<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abate Booking Widget Demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 40px 20px;
        max-width: 800px;
        margin: 0 auto;
        background-color: #f9fafb;
      }
      .demo-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .demo-header h1 {
        color: #111827;
        font-size: 2rem;
        margin-bottom: 8px;
      }
      .demo-header p {
        color: #6b7280;
        font-size: 1rem;
      }
      .widget-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        padding: 24px;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="demo-header">
      <h1>Abate Eye Hospital</h1>
      <p>Booking Widget Live Embed Demo</p>
    </div>

    <div class="widget-card">
      <!-- 1. The container the widget mounts into (No comments inside the tag!) -->
      <section
        class="buktor-container"
        data-url="https://dev.buktor.com"
        data-slug="abatehospitaltest2"
        data-type="appointment"
        data-date-view="calender"
      ></section>
    </div>

    <!-- 2. Loads the script from the same directory -->
    <script type="text/javascript" src="abate-embed.js"></script>
  </body>
</html>
